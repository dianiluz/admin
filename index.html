<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUPISSA | Panel Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/panel.css">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/assets/favicon.png">
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="logo-container">
                <img src="/assets/logo.png" alt="Cupissa Logo" class="logo">
            </div>
            <nav class="admin-nav">
                <button class="nav-btn active" data-target="dashboard">Dashboard</button>
                <button class="nav-btn" data-target="productos">Productos</button>
                <button class="nav-btn" data-target="pedidos">Pedidos</button>
                <button class="nav-btn" data-target="usuarios">Usuarios</button>
                <button class="nav-btn" data-target="marketing">Marketing</button>
                <button class="nav-btn" data-target="comisiones">Comisiones</button>
                <button class="nav-btn" data-target="reportes">Reportes</button>
            </nav>
            <div class="sidebar-footer">
                <button id="btn-instalar-pwa" style="display: none;">Instalar App</button>
                <button id="btn-logout">Cerrar Sesión</button>
            </div>
        </aside>
        <main class="content-area">
            <header class="top-bar">
                <h1 id="section-title" style="font-family: 'Bree Serif', serif;">Dashboard</h1>
                <div class="user-info">admin@cupissa.com</div>
            </header>
            <div id="dynamic-content" class="module-container" style="font-family: 'Poppins', sans-serif;">
                </div>
        </main>
    </div>
    
    <script src="js/config.js"></script>
    <script src="js/panel-admin.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</body>
</html>
