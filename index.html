<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUPISSA | Admin Pro</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/dianiluz/cupissa/main/assets/favicon.png">

    <style id="seguridad-cupissa">html { display: none !important; }</style>
    <script>
        (function() {
            var sesion = localStorage.getItem('cupissa_admin_session');
            if (!sesion || sesion === "undefined" || sesion === "null") {
                window.location.replace('login.html');
            } else {
                document.documentElement.style.display = 'block';
                const styleTag = document.getElementById('seguridad-cupissa');
                if (styleTag) styleTag.remove();
            }
        })();
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/panel.css">
    
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="mobile-overlay" class="mobile-overlay"></div>

    <div class="admin-layout">
        <aside class="sidebar" id="sidebar">
            <div class="logo-container">
                <img src="https://raw.githubusercontent.com/dianiluz/cupissa/main/assets/logo.png" alt="Cupissa Logo" class="logo">
            </div>
            
            <nav class="admin-nav" id="main-nav">
                <button class="nav-btn active" data-target="dashboard" data-roles="ADMIN">📊 Dashboard Global</button>
                
                <h4 class="nav-category">Comercio</h4>
                <button class="nav-btn" data-target="pedidos" data-roles="ADMIN">📦 Pedidos y Ventas</button>
                <button class="nav-btn" data-target="productos" data-roles="ADMIN">👗 Catálogo y Precios</button>
                
                <h4 class="nav-category">Operaciones</h4>
                <button class="nav-btn" data-target="inventario" data-roles="ADMIN">📦 Inventario y Bodega</button>
                <button class="nav-btn" data-target="logistica" data-roles="ADMIN">🚚 Logística y Despachos</button>
                
                <h4 class="nav-category">Auditoría y Control</h4>
                <button class="nav-btn" data-target="usuarios" data-roles="ADMIN">👥 Directorio y RRHH</button>
                <button class="nav-btn" data-target="finanzas" data-roles="ADMIN">💰 Auditoría Financiera</button>
                
                <h4 class="nav-category">Crecimiento</h4>
                <button class="nav-btn" data-target="marketing" data-roles="ADMIN">📈 Marketing y Promos</button>
                <button class="nav-btn" data-target="comisiones" data-roles="ADMIN">🤝 Comisiones y UGC</button>
            </nav>

            <div class="sidebar-footer">
                <button id="btn-instalar-pwa" class="btn-secundario" style="display: none; width: 100%; margin-bottom: 10px;">Descargar App</button>
                <button id="btn-actualizar-app" class="btn-secundario" style="width: 100%; margin-bottom: 10px; color: var(--color-primario); border-color: var(--color-primario);">↻ Actualizar App</button>
                <button id="btn-logout" class="btn-secundario" style="width: 100%; border-color: transparent;" onclick="cerrarSesionAdmin()">Cerrar Sesión</button>
            </div>
        </aside>

        <main class="content-area">
            <header class="top-bar">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <button id="btn-menu-mobile" class="hamburger-btn">☰</button>
                    <h1 id="section-title">Dashboard Global</h1>
                </div>
                <div class="user-info" id="header-user-email">Cargando usuario...</div>
            </header>
            
            <div id="dynamic-content" class="module-container"></div>
        </main>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script> 
    
    <script src="js/dashboard.js"></script> 
    <script src="js/productos.js"></script>
    <script src="js/pedidos.js"></script>
    <script src="js/inventario.js"></script> <script src="js/logistica.js"></script>
    
    <script src="js/usuarios.js"></script>
    <script src="js/auditoria-finanzas.js"></script> <script src="js/marketing.js"></script>
    <script src="js/comisiones.js"></script>

    <script src="js/panel-admin.js"></script>
</body>
</html>
