<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUPISSA | Panel Admin</title>

    <style id="seguridad-cupissa">html { display: none !important; }</style>
    <script>
        (function() {
            var sesion = localStorage.getItem('cupissa_admin_session');
            if (!sesion || sesion === "undefined" || sesion === "null") {
                window.location.replace('login.html');
            } else {
                document.getElementById('seguridad-cupissa').remove();
            }
        })();
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/panel.css">
    
    <link rel="manifest" href="/manifest.json">
</head>
<body>
    <div id="mobile-overlay" class="mobile-overlay"></div>

    <div class="admin-layout">
        <aside class="sidebar" id="sidebar">
            <div class="logo-container">
                <img src="/assets/logo.png" alt="Cupissa Logo" class="logo">
            </div>
            <nav class="admin-nav" id="main-nav">
                <button class="nav-btn active" data-target="dashboard">Dashboard</button>
                <button class="nav-btn" data-target="productos">Productos</button>
                <button class="nav-btn" data-target="pedidos">Pedidos</button>
                <button class="nav-btn" data-target="usuarios">Usuarios</button>
                <button class="nav-btn" data-target="marketing">Marketing</button>
                <button class="nav-btn" data-target="comisiones">Comisiones</button>
                <button class="nav-btn" data-target="reportes">Reportes</button>
            </nav>
            <div class="sidebar-footer">
                <button id="btn-instalar-pwa" class="btn-secundario" style="display: none; width: 100%; margin-bottom: 10px;">Descargar App</button>
                
                <button id="btn-actualizar-app" class="btn-secundario" style="width: 100%; margin-bottom: 10px; color: var(--color-primario); border-color: var(--color-primario);">↻ Actualizar App</button>
                
                <button id="btn-logout" class="btn-secundario" style="width: 100%; border-color: transparent;" onclick="cerrarSesionAdmin()">Cerrar Sesión</button>
            </div>
        </aside>

        <main class="content-area">
            <header class="top-bar">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <button id="btn-menu-mobile" class="hamburger-btn">☰</button>
                    <h1 id="section-title">Dashboard</h1>
                </div>
                <div class="user-info">admin@cupissa.com</div>
            </header>
            <div id="dynamic-content" class="module-container">
                </div>
        </main>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/modules/dashboard.js"></script>
    <script src="js/modules/productos.js"></script>
    <script src="js/modules/pedidos.js"></script>
    <script src="js/modules/usuarios.js"></script>
    <script src="js/panel-admin.js"></script>
</body>
</html>
